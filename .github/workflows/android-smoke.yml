name: Android smoke test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose APK is tested
        required: false
      apk_run:
        description: Android APK run whose artifact is tested instead
        required: false

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.apk_run }}" ]; then
            gh run download "${{ inputs.apk_run }}" --repo "$GITHUB_REPOSITORY" --name music-house-apk
            mv music-house-*.apk app.apk
          else
            gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output app.apk
          fi

      - name: Launch, play and turn the screen off
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash .github/android-smoke.sh

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            *.png
            keepalive.txt
            ui.xml
            logcat.txt
