name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the APK
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Android project
        run: pnpm exec cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            password="$KEYSTORE_PASSWORD"
          else
            # Without the stable key the APK still installs, but cannot update over an earlier one.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a one-off key."
            password="$(openssl rand -hex 24)"
            keytool -genkeypair -alias musichouse -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 \
              -keystore "$keystore" -storepass "$password" -keypass "$password" -dname "CN=Music House, O=zqmusic.cn, C=CN"
          fi
          echo "::add-mask::$password"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: musichouse
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="music-house-${RELEASE_TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$RELEASE_TAG" "$apk" --clobber

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: music-house-apk
          path: music-house-*.apk
